services:
  - type: web
    name: arduino-distance-dashboard
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: arduino-distance-db
          property: connectionString
      - key: API_TOKEN
        generateValue: true

databases:
  - name: arduino-distance-db
    plan: free
    databaseName: arduino_distance
    user: arduino_user
